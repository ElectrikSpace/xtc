constraints:
  - cu <= 64
  - br <= 64
  - RoB := 224
  - v_elts := 16
  - max_uk_vecs := 32
  - opt_ilp := 8
  - fr == fvr * v_elts
  - fvr * br + fvr + 1 <= max_uk_vecs
  - ilp(fvr, br, bc*wc*hc, fc, cc, RoB) >= opt_ilp
schedule:
  f: parallelize
  $: pack(C)=pack_c
  c:
  w:
  h:
  b:
  $ L3:
  f#fc:
  $ L2:
  w#wc:
  h#hc:
  b#bc:
  $ L1:
  r:
  s:
  c#cc: unroll=cu
  $ Register:
  b#br: unroll
  f#fr: vectorize
