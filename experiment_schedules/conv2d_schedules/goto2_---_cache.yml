constraints:
  - cu <= 64
  - bu <= 64
  - max_l1_elts := 8192
  - max_l2_elts := 262144
  - max_l3_elts := 9437184
  - footprint(B, L1) <= max_l1_elts
  - footprint(A, L2) <= max_l2_elts
  - footprint(B, L3) <= max_l3_elts
schedule:
  w: parallelize
  h: parallelize
  b: parallelize
  f: parallelize
  $ L3:
  f#fc:
  $ L2:
  w#wc:
  h#hc:
  b#bc:
  $: pack(C)=pack_c
  c:
  $ L1:
  r:
  s:
  c#cc: unroll=cu
  $ Register:
  b#br: unroll=bu
  f#fr: vectorize
