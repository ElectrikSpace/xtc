constraints:
  - max_l1_elts := 8192
  - max_l2_elts := 262144
  - max_l3_elts := 9437184
  - ku <= 64
  - nr * kc <= max_l1_elts
  - mc * kc <= max_l2_elts
  - nc * kc <= max_l3_elts
  - (mr,nr) in {(1,16),(1,64),(1,96),(1,128)}
schedule:
  j: parallelize
  $: pack(C)=pack_c
  k:
  i:
  j#nc: 
  i#mc: 
  k#kc: unroll=ku
  i#mr: unroll
  j#nr: vectorize
